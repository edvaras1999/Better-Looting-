; Better Looting - settings (v0.12)
; You can edit this file or use the MCM in game (Better Looting): the MCM writes to this same file.
; One setting per line, as name=value. Lines starting with ; are ignored.
; b... = 0 or 1 ; i... = integer (may be negative)
; Do NOT delete the [Settings] line.

[Settings]

; ---------- Look and language ----------
; Look of the loot window: 0 = QuickLoot Redesigned, 1 = original QuickLoot IE
iVisual=0
; Language of the MCM: 0 = English, 1 = Portuguese
iLanguage=0

; ---------- Behavior ----------
; Turn the loot window off in combat, when stealing, when pickpocketing or when the container is empty
bDisableInCombat=0
bDisableTheft=0
bDisablePickpocketing=0
bDisableIfEmpty=0

; Close the window when the container becomes empty
bCloseIfEmpty=0

; Console commands (startql, stopql, dumpql, setqlvar)
bUseConsole=0

; Force ANSI text (only if names show wrong characters)
bForceAnsi=0

; ---------- Sorting ----------
; Group by category, in this order: gold, gems, soul gems, lockpicks, ingots, ores, potions, food and drinks,
; books, notes, scrolls, arrows and bolts, jewelry, weapons, armor, clothes, everything else.
; Quest items always come first. With 0 the original QuickLoot order is used.
bSortByCategory=1
; Attribute inside each category: 0 = name, 1 = value, 2 = weight, 3 = value per weight
iSortBy=0
; 1 = descending order
bSortDescending=0
; 1 = weightless items first, inside each category
bSortWeightlessFirst=0

; ---------- Keys (loot window open) ----------
; Key codes: 1-255 = keyboard (DirectInput scan code), 256 and up = mouse buttons
;   (256 = left, 257 = right, 258 = middle, 259-263 = extra buttons).
; Common keyboard codes: E=18, R=19, C=46, F=33, X=45, V=47, G=34, Q=16, Z=44, Tab=15, Space=57.
; Modifier: 0 = none, 1 = Shift, 2 = Ctrl, 3 = Alt. The key only works with exactly that modifier.
; While the window is open, a key bound to an action does nothing else in the game.
; Take
iKeyTake=18
iModTake=0
; Take only one item of a stack
iKeyTakeOne=18
iModTakeOne=3
; Use / equip (armor, clothes, potions, food, ingredients, ammo; books and other items are only taken)
iKeyUse=18
iModUse=1
; Equip a one-handed weapon in the right hand / the left hand (two-handed weapons use either)
iKeyEquipRight=256
iModEquipRight=1
iKeyEquipLeft=257
iModEquipLeft=1
; Take all
iKeyTakeAll=46
iModTakeAll=0
; Search = open the container the usual way
iKeySearch=19
iModSearch=0
; Time to hold the Search key, in milliseconds (0 = one tap)
iSearchHoldMs=0

; ---------- Window ----------
; Window scale, in % (25 to 400)
iScale=100

; Visible lines: maximum (1 to 25) and minimum (0 up to the maximum)
iMaxLines=7
iMinLines=0

; Maximum items in the list (0 = no limit)
iItemLimit=0

; Window anchor: 0 = left/top, 1 = center, 2 = right/bottom
iAnchorX=0
iAnchorY=0

; Offset from the anchor (pixels, may be negative)
iOffsetX=100
iOffsetY=-200

; Opacity in %: with items (10 to 100) and when the container is empty (0 to 100)
iAlphaNormal=100
iAlphaEmpty=30

; ---------- Columns and icons ----------
bShowValue=1
bShowWeight=1
bShowValuePerWeight=0
bShowItemIcons=1

; ---------- Highlight: object under the crosshair ----------
; Needs BetterLooting.esp and the glow textures. The area scan below does not depend on this option.
bHLEnabled=1
; Glow color: 0 = gold, 1 = white, 2 = green, 3 = cyan, 4 = red
iHLColor=0
; What would be stealing gets a red glow (1 = yes)
bHLRedStealable=1
; Ignore objects without a name (1 = yes)
bHLIgnoreUnnamed=1
; Glow intensity (5 to 100), applied in 5 steps: 100, 60, 35, 18 and 8%. Lower it to see the objects' details.
iHLFillPercent=45
; How long the glow lasts under the crosshair, in milliseconds (100 to 10000)
iHLCrosshairMs=800
; Log what the highlight decides for each object under the crosshair (diagnosis only)
bHLDebug=0
; Object types to highlight (1 = yes)
bHLActivator=1
bHLTalkingActivator=1
bHLContainer=1
bHLDoor=1
bHLFlora=1
bHLFurniture=1
bHLArmor=1
bHLWeapon=1
bHLAmmo=1
bHLBook=1
bHLIngredient=1
bHLKey=1
bHLMisc=1
bHLPotion=1
bHLScroll=1
bHLSoulGem=1

; ---------- Highlight: area scan and lootable corpses ----------
; Hold the key to light up nearby objects and lootable corpses. Holding longer keeps refreshing the glow.
; It only works with the loot window closed; a short tap still does the key's normal action.
bHLScanEnabled=1
; Key (same codes as above; E = 18) and time to hold it, in milliseconds (0 = one tap)
iHLScanKey=18
iHLScanHoldMs=500
; Radius in game units (300 to 5000), glow duration in ms (500 to 10000) and maximum objects (8 to 128)
iHLScanRadius=1500
iHLScanMs=3000
iHLScanMax=64
; The scan and the crosshair also highlight corpses that have items (1 = yes)
bHLCorpses=1
; Hide corpses you already took something from or opened with Search (this game session only)
bHLCorpseHideSearched=1
; Corpse glow color: 0 = gold, 1 = white, 2 = green, 3 = cyan, 4 = red
iHLCorpseColor=2
; Maximum distance to highlight corpses (500 to 5000)
iHLCorpseMaxDist=2000

; ---------- Advanced ----------
; Hand identifiers used by Actor.EquipItemEx (SKSE) when equipping a weapon in a chosen hand.
; If your right and left hands come out swapped, swap these two values.
iEquipSlotIdRight=1
iEquipSlotIdLeft=2
