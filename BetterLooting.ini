; Better Looting - definicoes (v0.11)
; Pode editar aqui ou no MCM do jogo (Better Looting): o MCM grava neste mesmo ficheiro.
; Uma por linha, no formato nome=valor. Linhas que comecam por ; sao ignoradas.
; b... = 0 ou 1 ; i... = numero inteiro (pode ser negativo)
; NAO apague a linha [Settings].

[Settings]

; ---------- Visual e idioma ----------
; Visual da janela de loot: 0 = Redesigned, 1 = QuickLootIE original
iVisual=0
; Idioma do MCM: 0 = English, 1 = Portugues
iLanguage=0

; ---------- Comportamento ----------
; Desativar o menu de loot em combate, em roubo, em pickpocket ou quando estiver vazio
bDisableInCombat=0
bDisableTheft=0
bDisablePickpocketing=0
bDisableIfEmpty=0

; Fechar o menu quando o contentor fica vazio
bCloseIfEmpty=0

; Comandos de consola (startql, stopql, dumpql, setqlvar)
bUseConsole=0

; Forcar texto ANSI (apenas se houver nomes com caracteres errados)
bForceAnsi=0

; Pegar so num item (e nao a pilha toda) quando o Shift esquerdo esta premido: 1 = pegar sempre a pilha toda
bDisableLootSingle=0

; ---------- Ordenacao ----------
; Agrupar por categoria, pela ordem: ouro, gemas, gemas de alma, lockpicks, barras, minerio, pocoes,
; comida e bebida, livros, notas, pergaminhos, flechas e virotes, joias, armas, armaduras, roupas, resto.
; Itens de missao ficam sempre primeiro. Com 0 usa-se a ordem original do QuickLoot.
bSortByCategory=1
; Atributo dentro de cada categoria: 0 = nome, 1 = valor, 2 = peso, 3 = valor por peso
iSortBy=0
; 1 = ordem descendente
bSortDescending=0
; 1 = itens sem peso primeiro, dentro de cada categoria
bSortWeightlessFirst=0

; ---------- Teclas (com o menu de loot aberto) ----------
; Os numeros sao os codigos de tecla DirectInput: C=46, R=19, E=18, F=33, X=45, V=47, G=34
; Com o menu aberto estas teclas NAO fazem o que fariam com o menu fechado.
; Pegar tudo
iKeyTakeAll=46
; Procurar = abrir o contentor normal
iKeySearch=19
; Tempo a manter a tecla de Procurar premida, em ms: 0 = basta um toque
iSearchHoldMs=0

; ---------- Janela ----------
; Escala da janela, em % (25 a 400)
iScale=100

; Linhas visiveis na lista: maximo (1 a 25) e minimo (0 ate ao maximo)
iMaxLines=7
iMinLines=0

; Maximo de itens na lista (0 = sem limite)
iItemLimit=0

; Ancora da janela: 0 = esquerda/cima, 1 = centro, 2 = direita/baixo
iAnchorX=0
iAnchorY=0

; Deslocamento a partir da ancora (pixeis, pode ser negativo)
iOffsetX=100
iOffsetY=-200

; Opacidade em % : com itens (10 a 100) e quando o contentor esta vazio (0 a 100)
iAlphaNormal=100
iAlphaEmpty=30

; ---------- Realce de objetos (Highlight) ----------
; Realca o objeto para que olhas com um brilho. Precisa do BetterLooting.esp ativo.
; Realcar o objeto para que olha (mira). O varrimento por raio e independente desta opcao.
bHLEnabled=1
; Cor do brilho: 0 = dourado, 1 = branco, 2 = verde, 3 = ciano, 4 = vermelho
iHLColor=0
; O que seria roubo fica a vermelho (1 = sim)
bHLRedStealable=1
; Ignorar objetos sem nome (1 = sim)
bHLIgnoreUnnamed=1
; Intensidade do brilho (5 a 100). Aplica-se em 5 niveis: 100, 60, 35, 18 e 8%. Reduza para ver os detalhes dos objetos.
iHLFillPercent=45
; Duracao do brilho na mira, em milissegundos (100 a 10000)
iHLCrosshairMs=800
; Regista no log o que o realce decide para cada objeto na mira (so para diagnostico)
bHLDebug=0
; Tipos de objeto a realcar (1 = sim)
bHLActivator=1
bHLTalkingActivator=1
bHLContainer=1
bHLDoor=1
bHLFlora=1
bHLFurniture=1
bHLArmor=1
bHLWeapon=1
bHLAmmo=1
bHLBook=1
bHLIngredient=1
bHLKey=1
bHLMisc=1
bHLPotion=1
bHLScroll=1
bHLSoulGem=1

; ---------- Varrimento por raio e cadaveres com loot ----------
; Mantendo a tecla premida realca os objetos (e cadaveres com loot) a volta. Manter mais tempo refresca o brilho.
; So funciona com o menu de loot fechado; um toque curto continua a fazer a acao normal da tecla.
bHLScanEnabled=1
; Tecla (codigo DirectInput; E = 18) e tempo a manter premida, em milissegundos (0 = um toque)
iHLScanKey=18
iHLScanHoldMs=500
; Raio em unidades do jogo (300 a 5000), duracao do brilho em ms (500 a 10000) e maximo de objetos (8 a 128)
iHLScanRadius=1500
iHLScanMs=3000
iHLScanMax=64
; O varrimento realca tambem cadaveres com itens (1 = sim)
bHLCorpses=1
; Esconder cadaveres de que ja pegou algo ou que abriu com Procurar (so nesta sessao de jogo)
bHLCorpseHideSearched=1
; Cor dos cadaveres: 0 = dourado, 1 = branco, 2 = verde, 3 = ciano, 4 = vermelho
iHLCorpseColor=2
; Distancia maxima para realcar cadaveres (500 a 5000)
iHLCorpseMaxDist=2000

; ---------- Colunas e icones ----------
bShowValue=1
bShowWeight=1
bShowValuePerWeight=0
bShowItemIcons=1
