; Better Looting - definicoes (v0.1)
; Uma por linha, no formato nome=valor. Linhas que comecam por ; sao ignoradas.
; b... = 0 ou 1 ; i... = numero inteiro

; Desativar o menu de loot em combate, em roubo, em pickpocket ou quando estiver vazio
bDisableInCombat=0
bDisableTheft=0
bDisablePickpocketing=0
bDisableIfEmpty=0

; Fechar o menu quando o contentor fica vazio
bCloseIfEmpty=0

; Comandos de consola (startql, stopql, dumpql, setqlvar)
bUseConsole=0

; Forcar texto ANSI (apenas se houver nomes com caracteres errados)
bForceAnsi=0

; Pegar so num item (e nao a pilha toda) quando o Shift esquerdo esta premido
bDisableLootSingle=0

; Escala da janela, em % (25 a 400)
iScale=100

; Numero maximo de linhas visiveis na lista (1 a 25)
iItemLimit=7
