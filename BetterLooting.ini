; Better Looting - definicoes (v0.2)
; Uma por linha, no formato nome=valor. Linhas que comecam por ; sao ignoradas.
; b... = 0 ou 1 ; i... = numero inteiro (pode ser negativo)

; ---------- Comportamento ----------
; Desativar o menu de loot em combate, em roubo, em pickpocket ou quando estiver vazio
bDisableInCombat=0
bDisableTheft=0
bDisablePickpocketing=0
bDisableIfEmpty=0

; Fechar o menu quando o contentor fica vazio
bCloseIfEmpty=0

; Comandos de consola (startql, stopql, dumpql, setqlvar)
bUseConsole=0

; Forcar texto ANSI (apenas se houver nomes com caracteres errados)
bForceAnsi=0

; Pegar so num item (e nao a pilha toda) quando o Shift esquerdo esta premido
bDisableLootSingle=0

; ---------- Teclas (com o menu de loot aberto) ----------
; Os numeros sao os codigos de tecla DirectInput: C=46, R=19, E=18, F=33, X=45, V=47, G=34
; Com o menu aberto estas teclas NAO fazem o que fariam com o menu fechado.
; Pegar tudo (toque)
iKeyTakeAll=46
; Procurar = abrir o contentor normal (manter premida; um toque nao faz nada)
iKeySearch=19
; Tempo a manter a tecla de Procurar premida, em milissegundos
iSearchHoldMs=500

; ---------- Janela ----------
; Escala da janela, em % (25 a 400)
iScale=100

; Linhas visiveis na lista: maximo (1 a 25) e minimo (0 ate ao maximo)
iItemLimit=7
iMinLines=0

; Ancora da janela: 0 = esquerda/cima, 1 = centro, 2 = direita/baixo
iAnchorX=0
iAnchorY=0

; Deslocamento a partir da ancora (pixeis, pode ser negativo)
iOffsetX=100
iOffsetY=-200

; Opacidade em % : com itens (10 a 100) e quando o contentor esta vazio (0 a 100)
iAlphaNormal=100
iAlphaEmpty=30

; ---------- Colunas e icones ----------
bShowValue=1
bShowWeight=1
bShowValuePerWeight=0
bShowItemIcons=1
