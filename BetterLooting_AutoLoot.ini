; ------------------------------------------------------------------------------------------------
; LISTS (one entry per line)
;
; Name entries: exact:Gold Ingot | contains:ingot | starts:Iron | ends:Key    (no prefix = exact; not case sensitive)
; The name is the one you see in the game.
; Form entries: Skyrim.esm|0x0000000F   (plugin name | form ID without the load order byte)
;               or 0x0200ABCD            (the full form ID, which depends on your load order)
; ------------------------------------------------------------------------------------------------

; Always pick up and light these, whatever the switches and thresholds say.
[AllowNames]
; contains:dragon

[AllowForms]
; Skyrim.esm|0x0000000F

; Never pick up or light these.
[ForbidNames]
; contains:skull
; exact:Brass Goblet

[ForbidForms]
; Skyrim.esm|0x0001397D

; Flora, trees and ore veins to leave alone (names or forms, same syntax as above).
[ForbidActivators]
; contains:nirnroot

; How ore veins are recognised: by name (they are not a separate kind of object). Add your language here.
[OreVeinNames]
contains:ore vein
contains:veio
