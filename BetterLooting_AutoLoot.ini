; Better Looting - auto-loot rules (v0.14)
; This file holds the rules of the auto-loot feature. The feature itself (on/off, radius, keys) is in BetterLooting.ini
; and in the MCM. The MCM writes the per-type values below; the lists at the end you edit by hand.
; Lines starting with ; are ignored. Changes made by hand need a game restart.
;
; HOW IT DECIDES
;  1. Only loose objects, flora and ore veins are considered. Corpses, containers, doors, levers and anything owned
;     by someone (that would be stealing) are never touched.
;  2. The ForbidNames, ForbidForms and ForbidActivators lists always win: a match is never picked up or lit.
;  3. A match in AllowNames or AllowForms is always picked up and lit, regardless of the type switches and thresholds.
;  4. Otherwise the object's type decides: Pick = pick it up, Glow = make it glow. All the thresholds of the type
;     must be met (a threshold of 0 is off).
;
; PER TYPE:  Pick (0/1)   Glow (0/1)   Color (0 gold, 1 white, 2 green, 3 cyan, 4 red)
;            MinValue         minimum gold value of the item
;            MinValuePerWeight minimum value per unit of weight
;            MinArmor         minimum armor rating (armor types only)
;            MinDamage        minimum damage (weapon types and ammo only)
; Everything is off by default: turn on only what you want.

; One-handed weapons (swords, daggers, axes, maces)
[Type.Weapon1H]
Pick=0
Glow=0
Color=0
MinValue=0
MinValuePerWeight=0
MinDamage=0

